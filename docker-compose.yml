services:
  pg_dev:
    image: postgres:16-alpine
    container_name: pg_dev
    environment:
    # Cambio a variables de entorno para el uso de las credenciales
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Tegucigalpa # Hora local para la factura SAR
    ports:
      - "5432:5432"
    volumes:
      # Uso de un volumen para los datos en vez de un bind mount
      - pg_data:/var/lib/postgresql
      - ./database/overclock_hn.sql:/docker-entrypoint-initdb.d/1-schema.sql

volumes:
  pg_data:
